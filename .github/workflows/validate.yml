name: Validate Aperture
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --bin aperture-display
      - uses: actions/upload-artifact@v4
        with:
          name: aperture-display
          path: target/release/aperture-display.exe
